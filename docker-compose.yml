version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: novabank_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novabank_backend
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - CORS_ORIGIN=http://localhost:5173,http://localhost
    volumes:
      - ./backend/src/database/data:/app/src/database/data
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novabank_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_PORT=5173
    restart: unless-stopped
