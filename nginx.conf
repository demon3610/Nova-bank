events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream services
    upstream backend_api {
        server backend:4000;
        keepalive 32;
    }

    upstream frontend_spa {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost;

        # Forward API traffic to Node.js backend
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;

            # Protocol-Level & Header Forwarding for Vulnerability Testing:
            # 1. Forward original/rewrite headers for Vulnerability #08
            proxy_set_header X-Original-URL $http_x_original_url;
            proxy_set_header X-Rewrite-URL $http_x_rewrite_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 2. Allow Transfer-Encoding and Content-Length forwarding for CL.TE testing (Vuln #12)
            proxy_pass_request_headers on;
            proxy_buffering off;
        }

        # Static avatar uploads
        location /uploads/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
        }

        # Frontend SPA routing
        location / {
            proxy_pass http://frontend_spa;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
